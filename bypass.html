<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CART3R URL Resolver</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: #050505;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 580px;
  margin: 50px auto;
  padding: 24px;
  background: #101010;
  border: 1px solid #a51d32;
  border-radius: 16px;
  box-shadow: 0 0 25px #a51d3225;
}

h1 {
  color: #ff3048;
  text-align: center;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  background: #080808;
  border: 1px solid #333;
  border-radius: 8px;
  color: white;
  outline: none;
}

input:focus {
  border-color: #ff3048;
}

button {
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #c71932;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ed263f;
}

.main-button {
  width: 100%;
  margin-top: 12px;
}

.panel {
  margin-top: 20px;
  padding: 15px;
  background: #080808;
  border: 1px solid #292929;
  border-radius: 10px;
  overflow-wrap: anywhere;
}

.hidden {
  display: none;
}

.heading {
  color: #ff4056;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 12px;
}

.service {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #222;
  font-size: 13px;
}

.status {
  color: #ffbb55;
  font-size: 11px;
}

.success {
  color: #45df91;
}

.error {
  color: #ff5366;
}

.destination {
  color: #ddd;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.small-button {
  width: auto;
  padding: 10px;
  margin-top: 10px;
}

#message {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-top: 15px;
}

.footer {
  text-align: center;
  color: #555;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>CART3R URL</h1>
<div class="subtitle">ADVANCED LINK ANALYSIS SYSTEM v2.0</div>

<input
  id="url"
  type="url"
  placeholder="Paste your URL here..."
>

<button class="main-button" onclick="analyze()">
  ANALYZE URL
</button>

<div id="message">SYSTEM READY</div>

<div id="results" class="panel hidden">

  <div class="heading">DOMAIN DETECTION</div>
  <div id="detected"></div>

  <br>

  <div class="heading">RESOLUTION RESULT</div>
  <div id="destination" class="destination">
    Waiting for analysis...
  </div>

  <button class="small-button"
    onclick="copyDestination()">
    COPY DESTINATION
  </button>

  <br><br>

  <div class="heading">REDIRECT INFORMATION</div>
  <div id="redirectInfo" class="destination"></div>

</div>

<div class="panel">

  <div class="heading">SUPPORTED SERVICES</div>
  <div id="services"></div>

</div>

<div class="footer">
  CART3R.JAILBREAK | URL ANALYZER
</div>

</div>

<script>

// Supported domains and their detection labels.
const supported = [
  {
    name: "LootLabs",
    domains: ["lootlabs.gg", "loot-link.com"]
  },
  {
    name: "Linkvertise",
    domains: ["linkvertise.com", "linkvertise.lol"]
  },
  {
    name: "Junkie",
    domains: ["junkie"]
  },
  {
    name: "Rekonise",
    domains: ["rekonise.com"]
  },
  {
    name: "Kys Linkvertise",
    domains: ["kys.linkvertise.lol"]
  },
  {
    name: "Platorelay",
    domains: ["auth.platorelay.com"]
  },
  {
    name: "Panda Development",
    domains: ["panda-development.net"]
  }
];

let finalDestination = "";

// Display the supported services.
function renderServices() {
  document.getElementById("services").innerHTML =
    supported.map(service => `
      <div class="service">
        <span>${escapeHTML(service.name)}</span>
        <span class="status">DETECTOR READY</span>
      </div>
    `).join("");
}

// Prevent HTML injection in displayed data.
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// Validate URL.
function validateURL(value) {
  try {
    const parsed = new URL(value);

    if (!["http:", "https:"].includes(parsed.protocol)) {
      return null;
    }

    return parsed;
  } catch {
    return null;
  }
}

// Detect supported services.
function detectService(hostname) {
  hostname = hostname.toLowerCase();

  return supported.find(service =>
    service.domains.some(domain =>
      hostname === domain ||
      hostname.endsWith("." + domain)
    )
  );
}

// Analyze URL.
async function analyze() {

  const input = document.getElementById("url").value.trim();
  const message = document.getElementById("message");
  const results = document.getElementById("results");

  const parsed = validateURL(input);

  results.classList.add("hidden");
  finalDestination = "";

  if (!parsed) {
    message.textContent = "ERROR: INVALID URL";
    return;
  }

  message.textContent = "ANALYZING URL...";

  results.classList.remove("hidden");

  const service = detectService(parsed.hostname);

  document.getElementById("detected").innerHTML =
    service
      ? `<span class="success">${escapeHTML(service.name)} DETECTED</span>`
      : `<span class="status">UNKNOWN DOMAIN</span>`;

  document.getElementById("destination").textContent =
    "Checking publicly accessible redirects...";

  document.getElementById("redirectInfo").textContent =
    "Original URL: " + parsed.href;

  try {

    // Browser redirect inspection.
    // Cross-origin restrictions may prevent access.
    const response = await fetch(parsed.href, {
      method: "GET",
      redirect: "follow",
      mode: "cors"
    });

    finalDestination = response.url || parsed.href;

    document.getElementById("destination").textContent =
      finalDestination;

    document.getElementById("redirectInfo").textContent =
      "Original: " + parsed.href +
      "\nFinal: " + finalDestination +
      "\nHTTP status: " + response.status +
      "\nRedirect handling: Browser Fetch API";

    message.textContent = "ANALYSIS COMPLETED";

  } catch (error) {

    document.getElementById("destination").textContent =
      "Destination unavailable from browser.";

    document.getElementById("redirectInfo").textContent =
      "The website may block cross-origin requests, require " +
      "authentication, or require additional verification.";

    message.textContent = "PARTIAL ANALYSIS";

  }

}

// Copy result.
async function copyDestination() {

  if (!finalDestination) {
    document.getElementById("message").textContent =
      "No resolved destination available.";
    return;
  }

  try {
    await navigator.clipboard.writeText(finalDestination);

    document.getElementById("message").textContent =
      "DESTINATION COPIED";
  } catch {
    document.getElementById("message").textContent =
      "Clipboard access unavailable.";
  }

}

renderServices();

</script>

</body>
</html>
